site_name: "AI 시대의 구조적 사고 — 생각하는 힘 키우기"
site_description: "고등학교 1~2학년을 위한 15시간(10회×90분) AI 시대 역량 교육 과정. 구조적 사고력 → AI 협업 설계력 → 분야 융합 적용력의 3계층 구조."
site_author: Created with EduFlow

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: "다크 모드로 전환"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: "라이트 모드로 전환"
  font:
    text: Pretendard, Noto Sans KR, sans-serif
    code: JetBrains Mono, monospace
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - "Part 1 — 구조적 사고력":
    - "1회차: AI 시대, 무엇이 남을까?": chapter01.md
    - "2회차: 문제를 쪼개는 기술": chapter02.md
    - "3회차: 패턴 찾기와 핵심 추출": chapter03.md
    - "4회차: 해결 절차 설계하기": chapter04.md
  - "Part 2 — AI 협업 설계력":
    - "5회차: AI에게 시키는 3가지 수준": chapter05.md
    - "6회차: AI 협업 설계서 만들기": chapter06.md
    - "7회차: '만들어줘' vs '생각해봐'": chapter07.md
    - "8회차: 나만의 AI 활용 시스템 만들기": chapter08.md
  - "Part 3 — 분야 융합 적용력":
    - "9회차: 나의 Something 찾기": chapter09.md
    - "10회차: AI와 나의 미래": chapter10.md
